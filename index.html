
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.12);
      padding: 45px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 450px;
      width: 90%;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    button {
      background: white;
      color: #764ba2;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #eeeeff;
      transform: scale(1.05);
    }
    #message {
      margin-top: 20px;
      font-size: 16px;
      min-height: 24px;
    }
    footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Hello, World!</h1>
    <p>Welcome to my first webpage.</p>
    <button id="helloButton">Click Me</button>
    <div id="message" aria-live="polite"></div>
    <footer>Built with HTML, CSS and JavaScript</footer>
  </main>
  <script>
    const button = document.getElementById("helloButton");
    const message = document.getElementById("message");
    let clickCount = 0;

    button.addEventListener("click", function() {
      clickCount++;

      if (clickCount === 1) {
        message.textContent = "Hello there! 👋";
      } else if (clickCount < 5) {
        message.textContent = `Hello again! Click ${clickCount}.`;
      } else {
        message.textContent = "You're a Hello World expert! 🎉";
      }

      button.textContent = clickCount >= 5
        ? "Amazing!"
        : "Click Me Again";
    });
  </script>
</body>
</html>
